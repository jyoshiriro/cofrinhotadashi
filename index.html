<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tadashi's Pig Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 class="title">🏦 Tadashi's Pig Bank</h1>

    <div class="card">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Counting coins...</p>
      </div>

      <div id="content" class="content hidden">
        <img id="tadashi-img" src="" alt="Tadashi" class="tadashi-img">
        <p class="balance-label">My Savings</p>
        <p id="balance-value" class="balance-value"></p>
        <button class="refresh-btn" onclick="refresh()">🔄 Refresh</button>

        <div class="transactions-section">
          <p class="transactions-title">Last transactions</p>
          <div id="transactions" class="transactions"></div>
        </div>
      </div>

      <div id="error" class="error hidden">
        <p>😢 Could not load balance.<br>Make sure you're on ether.fi.</p>
        <button class="refresh-btn" onclick="refresh()">Try again</button>
      </div>
    </div>
  </div>

  <script src="funcoes.js"></script>
  <script>
    function getImage(balance) {
      if (balance < 10.01) return 'tadashi-nomoney.png';
      if (balance <= 50.0)  return 'tadashi.png';
      return 'tadashi-money.png';
    }

    function renderBalance(data) {
      document.getElementById('loading').classList.add('hidden');

      if (!data || data.balance === undefined || isNaN(data.balance)) {
        document.getElementById('error').classList.remove('hidden');
        return;
      }

      const balance = data.balance;
      const balanceEl = document.getElementById('balance-value');
      document.getElementById('tadashi-img').src = getImage(balance);
      balanceEl.textContent = new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(balance);

      balanceEl.className = 'balance-value ' + (
        balance < 10.01 ? 'balance-low'  :
        balance <= 50.0 ? 'balance-mid'  : 'balance-high'
      );

      const txList = document.getElementById('transactions');
      txList.innerHTML = '';
      (data.lastTransacions || []).forEach(tx => {
        const moeda = tx.moeda || 'BRL';
        const valorBruto = Number(tx.valor);
        const valor = (valorBruto < 0 ?"-":"")+(moeda === 'BRL' ? "R$" : "U$") + (valorBruto < 0 ? valorBruto*-1 : valorBruto).toFixed(2);
        const div = document.createElement('div');
        div.className = 'transaction';
        div.innerHTML = `
          <div class="tx-info">
            <span class="tx-onde">${tx.onde}</span>
            <span class="tx-quando">${tx.quando}</span>
          </div>
          <span class="tx-valor${tx.valor > 0 ? ' tx-valor--positive' : ''}${tx.realizada === false ? ' tx-valor--cancelada' : ''}">
            <span class="tx-valor-num">${valor}</span>${tx.realizada === false ? ' <span class="tx-cancelada-label">Cancelled</span>' : ''}
          </span>
        `;
        txList.appendChild(div);
      });

      document.getElementById('content').classList.remove('hidden');
    }

    async function refresh() {
      document.getElementById('content').classList.add('hidden');
      document.getElementById('error').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');
      try {
        const data = await fetchBalance();
        renderBalance(data);
      } catch (e) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        console.error(e);
      }
    }

    window.addEventListener('DOMContentLoaded', refresh);
  </script>
</body>
</html>
